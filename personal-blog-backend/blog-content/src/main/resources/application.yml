server:
  port: 8083

spring:
  application:
    name: blog-content
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  profiles:
    active: local
  cloud:
    nacos:
      server-addr: 1Panel-nacos-XNag-standalone:8848
      username: nacos
      password: 'Nc0s!X8vL#2@qP5^rT7'
      discovery:
        fail-fast: false
        register-enabled: true
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        ip-delete-timeout: 30000
      config:
        file-extension: yaml
        group: DEFAULT_GROUP
        refresh-enabled: true
  config:
    import:
      - optional:nacos:blog-content.yaml
      - optional:nacos:blog-content-${spring.profiles.active}.yaml

management:
  server:
    port: 9083
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,refresh

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

blog:
  search:
    enabled: true
  knowledge:
    cooccurrence-cron: "0 0 2 * * ?"
    hotness-cron: "0 0 * * * ?"
    decay-lambda: 0.01
    max-edges: 500
    graph-cache-ttl-hours: 25
    auto-tag-enabled: false
