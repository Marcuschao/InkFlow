spring:
  cloud:
    nacos:
      discovery:
        enabled: false
        register-enabled: false
        port: 8084
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/blog_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      leak-detection-threshold: 60000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 3000ms
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
  security:
    jwt:
      secret: local-dev-jwt-secret-change-me
      expiration: 43200
      remember-me-expiration: 604800
  ai:
    openai:
      api-key: CHANGE_ME
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 1024

blog:
  site-url: http://127.0.0.1:5173
  site-base-path: /pblog
  ai:
    gateway:
      enabled: true
      default-timeout-ms: 5000
      health-check-interval-ms: 30000
      half-open-interval-ms: 60000
      failure-threshold: 3
      log-async: true
      providers:
        - id: deepseek
          name: deepseek
          enabled: true
          api-key: ${spring.ai.openai.api-key}
          base-url: ${spring.ai.openai.base-url}
          models:
            - deepseek-chat
          priority: 1
          max-concurrency: 10
          timeout-ms: 5000
      routes:
        - task-type: "writing|polish|summary|expand|outline"
          primary: "deepseek:deepseek-chat"
          fallbacks: []
        - task-type: "agent|rag|chat"
          primary: "deepseek:deepseek-chat"
          fallbacks: []
        - task-type: "tag|classify"
          primary: "deepseek:deepseek-chat"
          fallbacks: []
      quota:
        global-daily-tokens: 1000000
        user-daily-tokens: 50000
  rag:
    enabled: false
  search:
    enabled: false
  oauth:
    enabled: false

minio:
  enabled: true
  endpoint: http://127.0.0.1:9005
  access-key: minioadmin
  secret-key: minioadmin
  public-base-url: http://127.0.0.1:9005

logging:
  level:
    com.blog.ai: DEBUG
