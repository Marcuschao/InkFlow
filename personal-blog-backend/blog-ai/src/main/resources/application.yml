server:
  port: 8084

spring:
  application:
    name: blog-ai
  profiles:
    active: local
  cloud:
    nacos:
      server-addr: 1Panel-nacos-XNag-standalone:8848
      username: nacos
      password: 'Nc0s!X8vL#2@qP5^rT7'
      discovery:
        fail-fast: false
        register-enabled: true
        heart-beat-interval: 5000
        heart-beat-timeout: 15000
        ip-delete-timeout: 30000
      config:
        file-extension: yaml
        group: DEFAULT_GROUP
        refresh-enabled: true
  config:
    import:
      - optional:nacos:blog-ai.yaml
      - optional:nacos:blog-ai-${spring.profiles.active}.yaml

management:
  server:
    port: 9084
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,refresh

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
